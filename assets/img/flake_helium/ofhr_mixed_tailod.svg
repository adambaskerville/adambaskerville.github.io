<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mixed DD core and OD tail preconditioner</title>
  <desc id="desc">A block matrix diagram showing a large inherited core built in double-double and new high-total-order tail rows and columns overwritten using oct-double matrix-free application.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .ink { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .math { fill: #111827; font-family: "Times New Roman", serif; font-style: italic; }
      .core { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .tail { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .mix { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="ink" x="60" y="72" font-size="34" font-weight="700">Spend oct-double only where the cancellation lives</text>
  <text class="muted" x="60" y="110" font-size="21">The previous-order core is numerically tame. The newly added high-total-order rows and columns are not.</text>
  <rect class="panel" x="75" y="165" width="500" height="430" rx="8"/>
  <text class="ink" x="105" y="215" font-size="24" font-weight="700">F32 from F30</text>
  <text class="muted" x="105" y="252" font-size="19">N = 6834 coordinates</text>
  <text class="muted" x="105" y="282" font-size="19">Core C = inherited F30, 5712 coordinates</text>
  <text class="muted" x="105" y="312" font-size="19">Tail T = new F32 shell, 1122 coordinates</text>
  <rect class="core" x="135" y="365" width="285" height="170" rx="4"/>
  <rect class="mix" x="420" y="365" width="75" height="170" rx="4"/>
  <rect class="mix" x="135" y="535" width="285" height="45" rx="4"/>
  <rect class="tail" x="420" y="535" width="75" height="45" rx="4"/>
  <text class="math" x="235" y="455" font-size="28">H_CC^DD</text>
  <text class="math" x="430" y="455" font-size="25">H_CT^OD</text>
  <text class="math" x="235" y="565" font-size="25">H_TC^OD</text>
  <text class="math" x="430" y="565" font-size="25">H_TT^OD</text>
  <path class="arrow" d="M 600 385 H 735"/>
  <path class="arrow" d="M 600 510 H 735"/>
  <rect class="panel" x="760" y="165" width="365" height="430" rx="8"/>
  <text class="ink" x="795" y="215" font-size="24" font-weight="700">Build recipe</text>
  <rect class="core" x="795" y="255" width="290" height="72" rx="8"/>
  <text class="ink" x="820" y="300" font-size="20" font-weight="700">1. Build whole block in DD</text>
  <rect class="tail" x="795" y="365" width="290" height="92" rx="8"/>
  <text class="ink" x="820" y="405" font-size="20" font-weight="700">2. Overwrite tail rows/cols</text>
  <text class="muted" x="820" y="435" font-size="18">using OD matrix-free apply</text>
  <rect class="mix" x="795" y="495" width="290" height="72" rx="8"/>
  <text class="ink" x="820" y="540" font-size="20" font-weight="700">3. Davidson uses the mix</text>
  <text class="ink" x="170" y="650" font-size="22" font-weight="700">Convenient split: angular sector</text>
  <text class="muted" x="455" y="650" font-size="19">failed, because every sector contains high-order functions</text>
  <text class="ink" x="170" y="685" font-size="22" font-weight="700">Correct split: total order</text>
  <text class="muted" x="407" y="685" font-size="19">works with the cancellation mechanism</text>
</svg>
